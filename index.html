<!DOCTYPE html>
<html>
    <head> </head>
        <link rel = "stylesheet" href = "style.css" />
    <body>
    <img id="boba-image" class="boba-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1-ouqrOehBEFK5mwUtaPnrC0q77Hd0TWNUBj3npxRrQ&s=10" alt="Boba drink" width="600" role="button" tabindex="0" aria-label="Click 10 times to change the boba image">
    <h1> Cool Boba </h1>
    <h2></h2>
    <p style="color:lightblue;">/HackClub</p>

    
    <textarea id="my-text" rows="5" cols="30" placeholder="Type here..."></textarea>
    <script>
        const bobaImage = document.getElementById("boba-image");
        let imageClickCount = 0;
        let gameComplete = false;

        bobaImage.addEventListener("click", function () {
            imageClickCount += 1;
            if (imageClickCount === 10) {
                document.querySelector("h1").textContent = "Math Boba";
                document.querySelector("p").textContent = "√-1";
            }else if (imageClickCount === 100) {
                document.body.style.backgroundColor = "lightpink";
                document.querySelector("p").style.color = "lightpink";
                document.querySelector("h1").textContent = "To boba or not to boba";
                document.querySelector("p").textContent = "Background color = ";
            }
        });

        bobaImage.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                bobaImage.click();
            }
        });

        document.getElementById("my-text").addEventListener("keydown", function (event) {
            
                if (event.key === "Enter") {
                event.preventDefault();
                const text = this.value.trim();

                if (gameComplete) {
                    this.value = "cool boba";
                    return;
                }
                
               
                if (text === "/HackClub" && imageClickCount <= 99 && gameComplete !== true) {
                    
                    document.querySelector("h1").textContent = "Coolest Boba";
                    document.querySelector("p").textContent = "JavaIsCool";

                } else if (text === "/HackClub" && imageClickCount > 99) {
                    document.querySelector("h1").textContent = "Cool Boba";
                    document.querySelector("h2").textContent = "/HackClub";
                    document.querySelector("p").textContent = "Made by Roshan Jagadeesan";
                    gameComplete = true;

                } else if (text === "Pink" || text === "pink" || text === "PINK" || text === "Light pink" || text === "light pink" 
                || text === "LIGHT PINK" || text === "Light Pink" || text === "LIGHTPINK" || text === "lightpink" 
                || text === "Lighpink" && imageClickCount > 99) {
                    
                    document.body.style.backgroundColor = "lightblue";
                    document.querySelector("p").style.color = "lightblue";
                    document.querySelector("h1").textContent = "Cool Boba";
                    document.querySelector("p").textContent = "Remember...";
                    

                }else if (text == "money boba" || text == "money/boba" || text == "Money Boba" || text == "Money/Boba" && imageClickCount > 9) {
                    
                    document.querySelector("h1").textContent = "...";
                    document.querySelector("p").textContent = "BobaClick100";
                
                } else if ((text == "Cool Boba" || text == "Cool/Boba" || text == "cool boba" || text == "cool/boba") || text == "Cool boba" || text == "cool Boba" && imageClickCount > 9) {
                    
                    document.querySelector("h1").textContent = "-- --- -. . -.-- / -... --- -... .-";
                    document.querySelector("p").textContent = "";
               
                }else if (text == "i" && imageClickCount > 9){
                    
                    document.querySelector("h1").textContent = "3, 15, 15, 12 / 2, 15, 2, 1";
                    document.querySelector("p").textContent = "Numbers to Letters";
                    
                } else if (text == "print(\"Hello World!\")") {
                    
                    document.querySelector("h1").textContent = "Hello World!";
                    document.querySelector("p").textContent = "BobaClick10";
                
                } else if (text == "System.out.println (\"Hello World!\");" || text == "System.out.print(\"Hello World!\");") {
                   
                    document.querySelector("h1").textContent = "Hello World!";
                    document.querySelector("p").textContent = "JavaToPython";
                
                } else if (text == "JavaIsCool") {
                    document.querySelector("h1").textContent = "JavaIsCool";
                    document.querySelector("p").textContent = "Hello World!";
                
                } else if (text == "hack_club" || text == "hack club" 
                || text == "Hack Club" || text == "Hack club") {
                    document.querySelector("h1").textContent = "Cooler Boba";
                
                }else if (gameComplete !== true) {  
                    document.querySelector("h1").textContent = "Cool Boba";
                    document.querySelector("p").textContent = "/HackClub";

                }else if (gameComplete === true) {
                    
                    document.querySelector("h1").textContent = "Game Complete";
                    document.querySelector("p").textContent = "";

                    
                }   
                }      
        }); 
    </script>

    </body>
</html>
